name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Software unit tests (hardware capture excluded on CI)
        run: python -m pytest -m "not desktop" --junitxml=reports/ci-tests.xml
      - name: Build real Windows executable
        run: python -m PyInstaller --noconfirm --clean NexusCamStudio.spec
      - name: Package
        run: python -m tools.make_release
      - uses: actions/upload-artifact@v4
        with:
          name: NexusCamStudio-Windows
          path: |
            dist/NexusCamStudio.exe
            ../NexusCamStudio-Windows-v1.1.zip
            ../NexusCamStudio-Windows-v1.1.sha256
            reports/ci-tests.xml
